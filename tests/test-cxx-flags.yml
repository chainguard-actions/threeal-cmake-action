name: Test CMake with C++ compiler flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install cmake and build tools
        run: |
          # Try without sudo first (act often runs as root), then with sudo
          (apt-get update -y && apt-get install -y cmake g++ build-essential) 2>/dev/null || \
          (sudo apt-get update -y && sudo apt-get install -y cmake g++ build-essential)
          hash -r
          cmake --version
          g++ --version
      - id: action
        uses: .
        with:
          source-dir: tests/fixtures/flags-project
          build-dir: /tmp/cmake-cxx-flags-build
          cxx-flags: -Wall
          run-build: "true"
      - name: Assert build-dir output is set
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "build-dir: $BUILD_DIR"
          if [ -z "$BUILD_DIR" ]; then
            echo "FAIL: build-dir output is empty"
            exit 1
          fi
          echo "PASS: build-dir output is set to $BUILD_DIR"
      - name: Assert CMakeCache.txt was created (configure succeeded)
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "Checking for CMakeCache.txt in $BUILD_DIR"
          if [ ! -f "$BUILD_DIR/CMakeCache.txt" ]; then
            echo "FAIL: CMakeCache.txt not found — configure did not succeed"
            ls -la "$BUILD_DIR" || true
            exit 1
          fi
          echo "PASS: CMakeCache.txt found"
      - name: Assert C++ binary was built
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "Checking for hello_cxx binary in $BUILD_DIR"
          if find "$BUILD_DIR" -name "hello_cxx" -type f | grep -q .; then
            echo "PASS: hello_cxx binary found"
            find "$BUILD_DIR" -name "hello_cxx" -type f
          else
            echo "FAIL: hello_cxx binary not found — build did not succeed"
            ls -la "$BUILD_DIR" || true
            exit 1
          fi
