name: Test build args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cmake and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gcc

      - name: Create a simple CMake project
        run: |
          mkdir -p /tmp/cmake-buildargs-src
          cat > /tmp/cmake-buildargs-src/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.10)
          project(BuildArgsTest)
          add_executable(buildtest main.c)
          EOF
          cat > /tmp/cmake-buildargs-src/main.c << 'EOF'
          int main() { return 0; }
          EOF

      - id: action
        uses: .
        with:
          source-dir: /tmp/cmake-buildargs-src
          build-dir: /tmp/cmake-buildargs-build
          run-build: true
          build-args: --verbose

      - name: Assert build-dir output is set
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "build-dir: $BUILD_DIR"
          if [ -z "$BUILD_DIR" ]; then
            echo "FAIL: build-dir output is empty"
            exit 1
          fi
          echo "PASS: build-dir output is set"

      - name: Assert build artifacts exist
        run: |
          if [ ! -d "/tmp/cmake-buildargs-build" ]; then
            echo "FAIL: build directory does not exist"
            exit 1
          fi
          if [ ! -f "/tmp/cmake-buildargs-build/buildtest" ]; then
            echo "FAIL: expected executable 'buildtest' not found"
            ls -la /tmp/cmake-buildargs-build || true
            exit 1
          fi
          echo "PASS: build artifacts exist"
