name: Test basic CMake configure and build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install cmake and build tools
        run: |
          # Try without sudo first (act often runs as root), then with sudo
          (apt-get update -y && apt-get install -y cmake gcc build-essential) 2>/dev/null || \
          (sudo apt-get update -y && sudo apt-get install -y cmake gcc build-essential)
          hash -r
          cmake --version
          gcc --version
      - id: action
        uses: .
        with:
          source-dir: tests/fixtures/basic-project
          build-dir: /tmp/cmake-basic-build
      - name: Assert build-dir output is set
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "build-dir: $BUILD_DIR"
          if [ -z "$BUILD_DIR" ]; then
            echo "FAIL: build-dir output is empty"
            exit 1
          fi
          echo "PASS: build-dir output is set to $BUILD_DIR"
      - name: Assert build directory exists
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "Checking build directory: $BUILD_DIR"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "FAIL: build directory does not exist: $BUILD_DIR"
            exit 1
          fi
          echo "PASS: build directory exists"
      - name: Assert CMakeCache.txt was created (configure succeeded)
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "Checking for CMakeCache.txt in $BUILD_DIR"
          if [ ! -f "$BUILD_DIR/CMakeCache.txt" ]; then
            echo "FAIL: CMakeCache.txt not found — configure did not succeed"
            ls -la "$BUILD_DIR" || true
            exit 1
          fi
          echo "PASS: CMakeCache.txt found"
      - name: Assert hello binary was built
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "Checking for hello binary in $BUILD_DIR"
          # Binary may be directly in build dir or in a subdirectory
          if find "$BUILD_DIR" -name "hello" -type f | grep -q .; then
            echo "PASS: hello binary found"
            find "$BUILD_DIR" -name "hello" -type f
          else
            echo "FAIL: hello binary not found — build did not succeed"
            ls -la "$BUILD_DIR" || true
            exit 1
          fi
