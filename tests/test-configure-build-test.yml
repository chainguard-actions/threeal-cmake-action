name: Test CMake configure, build, and test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cmake and build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake g++

      - name: Run CMake action (configure + build + test)
        id: action
        uses: .
        with:
          source-dir: tests/fixtures/simple-project
          build-dir: /tmp/cmake-full-build
          run-build: "true"
          run-test: "true"

      - name: Assert CMakeCache.txt was created (configure succeeded)
        run: |
          BUILD_DIR="/tmp/cmake-full-build"
          if [ ! -f "$BUILD_DIR/CMakeCache.txt" ]; then
            echo "FAIL: CMakeCache.txt not found — configure step did not succeed"
            ls -la "$BUILD_DIR" || echo "(build dir does not exist)"
            exit 1
          fi
          echo "PASS: configure succeeded"

      - name: Assert binary was produced (build succeeded)
        run: |
          BUILD_DIR="/tmp/cmake-full-build"
          if [ ! -f "$BUILD_DIR/hello_world" ]; then
            echo "FAIL: hello_world binary not found — build step did not succeed"
            ls -la "$BUILD_DIR" || echo "(build dir does not exist)"
            exit 1
          fi
          echo "PASS: build succeeded"

      - name: Assert CTest results exist (test ran)
        run: |
          BUILD_DIR="/tmp/cmake-full-build"
          # CTest creates a Testing directory with results
          if [ ! -d "$BUILD_DIR/Testing" ]; then
            echo "FAIL: Testing directory not found — ctest did not run"
            ls -la "$BUILD_DIR" || echo "(build dir does not exist)"
            exit 1
          fi
          echo "PASS: ctest ran and produced Testing directory"
