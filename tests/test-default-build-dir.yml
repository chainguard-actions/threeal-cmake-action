name: Test Default Build Directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cmake
        run: |
          apt-get update -y && apt-get install -y cmake gcc 2>/dev/null || \
          (sudo apt-get update -y && sudo apt-get install -y cmake gcc)

      - name: Create a simple CMake project
        run: |
          mkdir -p /tmp/cmake-project-default
          cat > /tmp/cmake-project-default/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.10)
          project(HelloWorld)
          add_executable(hello main.c)
          EOF
          cat > /tmp/cmake-project-default/main.c << 'EOF'
          #include <stdio.h>
          int main() {
            printf("Hello, World!\n");
            return 0;
          }
          EOF

      - id: action
        uses: .
        with:
          source-dir: /tmp/cmake-project-default

      - name: Assert build-dir output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "actual build-dir: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: build-dir output is empty"
            exit 1
          fi
          echo "PASS: build-dir output is non-empty: $ACTUAL"

      - name: Assert build-dir output matches expected default
        env:
          ACTUAL: ${{ steps.action.outputs.build-dir }}
        run: |
          EXPECTED="/tmp/cmake-project-default/build"
          echo "actual: $ACTUAL"
          echo "expected: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected build-dir to be '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: build-dir output matches expected default"

      - name: Assert build directory exists
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "Checking build directory: $BUILD_DIR"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "FAIL: build directory '$BUILD_DIR' does not exist"
            exit 1
          fi
          echo "PASS: build directory exists"

      - name: Assert CMake cache was created
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          if [ ! -f "$BUILD_DIR/CMakeCache.txt" ]; then
            echo "FAIL: CMakeCache.txt not found in '$BUILD_DIR'"
            exit 1
          fi
          echo "PASS: CMakeCache.txt found in $BUILD_DIR"
