name: Test CMake with options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install cmake and build tools
        run: |
          # Try without sudo first (act often runs as root), then with sudo
          (apt-get update -y && apt-get install -y cmake gcc build-essential) 2>/dev/null || \
          (sudo apt-get update -y && sudo apt-get install -y cmake gcc build-essential)
          hash -r
          cmake --version
          gcc --version
      - id: action
        uses: .
        with:
          source-dir: tests/fixtures/options-project
          build-dir: /tmp/cmake-options-build
          options: MY_OPTION=ON
          run-build: "true"
      - name: Assert build-dir output is set
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "build-dir: $BUILD_DIR"
          if [ -z "$BUILD_DIR" ]; then
            echo "FAIL: build-dir output is empty"
            exit 1
          fi
          echo "PASS: build-dir output is set"
      - name: Assert CMakeCache.txt contains MY_OPTION=ON
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "Checking CMakeCache.txt for MY_OPTION=ON in $BUILD_DIR"
          if ! grep -q "MY_OPTION:BOOL=ON" "$BUILD_DIR/CMakeCache.txt"; then
            echo "FAIL: MY_OPTION=ON not found in CMakeCache.txt"
            grep "MY_OPTION" "$BUILD_DIR/CMakeCache.txt" || echo "(MY_OPTION not in cache)"
            exit 1
          fi
          echo "PASS: MY_OPTION=ON found in CMakeCache.txt"
      - name: Assert hello binary was built
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "Checking for hello binary in $BUILD_DIR"
          if find "$BUILD_DIR" -name "hello" -type f | grep -q .; then
            echo "PASS: hello binary found"
            find "$BUILD_DIR" -name "hello" -type f
          else
            echo "FAIL: hello binary not found"
            ls -la "$BUILD_DIR" || true
            exit 1
          fi
