name: Test CMake configuration args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cmake and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gcc

      - name: Create a simple CMake project
        run: |
          mkdir -p /tmp/cmake-args-src
          cat > /tmp/cmake-args-src/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.10)
          project(ArgsTest)
          add_executable(argstest main.c)
          EOF
          cat > /tmp/cmake-args-src/main.c << 'EOF'
          #include <stdio.h>
          int main() {
            printf("Hello from args test!\n");
            return 0;
          }
          EOF

      - id: action
        uses: .
        with:
          source-dir: /tmp/cmake-args-src
          build-dir: /tmp/cmake-args-build
          args: --warn-uninitialized
          run-build: true

      - name: Assert build-dir output is set
        env:
          BUILD_DIR: ${{ steps.action.outputs.build-dir }}
        run: |
          echo "build-dir: $BUILD_DIR"
          if [ -z "$BUILD_DIR" ]; then
            echo "FAIL: build-dir output is empty"
            exit 1
          fi
          echo "PASS: build-dir output is set to $BUILD_DIR"

      - name: Assert CMakeCache exists (configuration succeeded)
        run: |
          if [ ! -f "/tmp/cmake-args-build/CMakeCache.txt" ]; then
            echo "FAIL: CMakeCache.txt not found — configuration did not succeed"
            exit 1
          fi
          echo "PASS: CMakeCache.txt found"

      - name: Assert build artifact exists
        run: |
          if [ ! -f "/tmp/cmake-args-build/argstest" ]; then
            echo "FAIL: expected executable 'argstest' not found"
            ls -la /tmp/cmake-args-build || true
            exit 1
          fi
          echo "PASS: build artifact exists"
