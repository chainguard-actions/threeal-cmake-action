name: Test CMake with build-args and test-args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cmake and build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake g++

      - name: Run CMake action with build-args and test-args
        id: action
        uses: .
        with:
          source-dir: tests/fixtures/simple-project
          build-dir: /tmp/cmake-build-test-args
          run-build: "true"
          build-args: "--verbose"
          run-test: "true"
          test-args: "--output-on-failure"

      - name: Assert CMakeCache.txt was created (configure succeeded)
        run: |
          BUILD_DIR="/tmp/cmake-build-test-args"
          echo "Checking for CMakeCache.txt in $BUILD_DIR"
          if [ ! -f "$BUILD_DIR/CMakeCache.txt" ]; then
            echo "FAIL: CMakeCache.txt not found — configure step did not succeed"
            ls -la "$BUILD_DIR" || echo "(build dir does not exist)"
            exit 1
          fi
          echo "PASS: configure succeeded"

      - name: Assert binary was produced (build with build-args succeeded)
        run: |
          BUILD_DIR="/tmp/cmake-build-test-args"
          echo "Checking for hello_world binary in $BUILD_DIR"
          if [ ! -f "$BUILD_DIR/hello_world" ]; then
            echo "FAIL: hello_world binary not found — build step did not succeed"
            ls -la "$BUILD_DIR" || echo "(build dir does not exist)"
            exit 1
          fi
          echo "PASS: build succeeded with build-args"

      - name: Assert CTest results exist (test ran with test-args)
        run: |
          BUILD_DIR="/tmp/cmake-build-test-args"
          echo "Checking for Testing directory in $BUILD_DIR"
          if [ ! -d "$BUILD_DIR/Testing" ]; then
            echo "FAIL: Testing directory not found — ctest did not run"
            ls -la "$BUILD_DIR" || echo "(build dir does not exist)"
            exit 1
          fi
          echo "PASS: ctest ran with test-args and produced Testing directory"
