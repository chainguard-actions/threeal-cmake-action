name: Test CMake with Ninja generator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cmake and build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake g++ ninja-build

      - name: Run CMake action with Ninja generator
        id: action
        uses: .
        with:
          source-dir: tests/fixtures/simple-project
          build-dir: /tmp/cmake-ninja-build
          generator: Ninja
          run-build: "false"
          run-test: "false"

      - name: Assert CMakeCache.txt was created (configure succeeded)
        run: |
          BUILD_DIR="/tmp/cmake-ninja-build"
          echo "Checking for CMakeCache.txt in $BUILD_DIR"
          if [ ! -f "$BUILD_DIR/CMakeCache.txt" ]; then
            echo "FAIL: CMakeCache.txt not found — configure step did not succeed"
            ls -la "$BUILD_DIR" || echo "(build dir does not exist)"
            exit 1
          fi
          echo "PASS: CMakeCache.txt found"

      - name: Assert Ninja was used as the generator
        run: |
          BUILD_DIR="/tmp/cmake-ninja-build"
          echo "Checking CMakeCache.txt for Ninja generator..."
          if ! grep -q "CMAKE_GENERATOR:INTERNAL=Ninja" "$BUILD_DIR/CMakeCache.txt"; then
            echo "FAIL: Ninja generator not found in CMakeCache.txt"
            grep "CMAKE_GENERATOR" "$BUILD_DIR/CMakeCache.txt" || true
            exit 1
          fi
          echo "PASS: Ninja generator confirmed in CMakeCache.txt"
